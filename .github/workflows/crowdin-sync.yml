name: Crowdin Sync

on:
  push:
    paths:
      - 'l10n/intl_en.arb'
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-pretranslate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload sources and translations to Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: true
          download_translations: false
          auto_approve_imported: true
          import_eq_suggestions: true
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Auto-label new strings for AI translation
        run: |
          # Get or create auto-translate label
          LABEL_ID=$(curl -s "https://api.crowdin.com/api/v2/projects/${{ secrets.CROWDIN_PROJECT_ID }}/labels" \
            -H "Authorization: Bearer ${{ secrets.CROWDIN_PERSONAL_TOKEN }}" | \
            jq -r '.data[] | select(.data.title == "auto-translate") | .data.id')

          if [ -z "$LABEL_ID" ]; then
            LABEL_ID=$(curl -s -X POST "https://api.crowdin.com/api/v2/projects/${{ secrets.CROWDIN_PROJECT_ID }}/labels" \
              -H "Authorization: Bearer ${{ secrets.CROWDIN_PERSONAL_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"title": "auto-translate"}' | jq -r '.data.id')
          fi

          echo "Label ID: $LABEL_ID"

          # Sacred text patterns to exclude
          EXCLUDE="azkarList|afterSalahHadith|duaaElEftarText|takbeerAleidText|jumuaaHadith|duaaBetweenSalahAndAdhan|salatKhayrMinaNawm"

          # Get all strings and label new ones (without labels) except sacred texts
          OFFSET=0
          LABELED=0
          while true; do
            STRINGS=$(curl -s "https://api.crowdin.com/api/v2/projects/${{ secrets.CROWDIN_PROJECT_ID }}/strings?limit=500&offset=$OFFSET" \
              -H "Authorization: Bearer ${{ secrets.CROWDIN_PERSONAL_TOKEN }}")

            COUNT=$(echo "$STRINGS" | jq '.data | length')
            [ "$COUNT" -eq 0 ] && break

            # Get strings without labels and not matching exclude patterns
            IDS=$(echo "$STRINGS" | jq -r --arg ex "$EXCLUDE" '.data[] | select((.data.labelIds | length) == 0) | select(.data.identifier | test($ex) | not) | .data.id')

            for ID in $IDS; do
              curl -s -X POST "https://api.crowdin.com/api/v2/projects/${{ secrets.CROWDIN_PROJECT_ID }}/strings/$ID/labels" \
                -H "Authorization: Bearer ${{ secrets.CROWDIN_PERSONAL_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d "{\"labelIds\": [$LABEL_ID]}" > /dev/null
              LABELED=$((LABELED + 1))
            done

            OFFSET=$((OFFSET + 500))
          done

          echo "Labeled $LABELED new strings with 'auto-translate'"

      - name: Pre-translate new strings with AI
        uses: crowdin/github-action@v2
        with:
          command: 'pre-translate'
          command_args: '--method ai --ai-prompt 332920 --translate-untranslated-only --label auto-translate --auto-approve-option all'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  download-translations:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: sync-and-pretranslate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          # Only download approved translations (human or AI-approved)
          export_only_approved: true
          # Skip strings without translations (prevents empty overwrites)
          skip_untranslated_strings: true
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: 'chore(l10n): sync translations from Crowdin'
          pull_request_body: |
            This PR syncs the latest translations from Crowdin.

            - Auto-generated by Crowdin GitHub Action
            - Pre-translated strings using AI (GPT-4.1)
            - Only approved translations are included
          pull_request_base_branch_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
