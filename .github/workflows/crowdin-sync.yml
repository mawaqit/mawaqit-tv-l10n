name: Crowdin Sync

# English change -> AI translation -> approved automatically -> PR.
# Crowdin is the source of truth for translations (since the one-time GitHub baseline,
# crowdin-baseline.yml): fix translations in Crowdin, not in git — the next sync overwrites git.
# A proofreader's approved edit in Crowdin replaces the AI text; crowdin-nightly.yml (on main)
# starts this workflow every night so those edits reach GitHub without an English change.

on:
  push:
    paths:
      - 'l10n/intl_en.arb'
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-sync

env:
  # Crowdin branch `dev` mirrors git `dev` and holds every existing translation and approval.
  CROWDIN_BRANCH: dev
  CROWDIN_FILE: l10n/intl_en.arb
  CROWDIN_AI_PROMPT_ID: ${{ vars.CROWDIN_AI_PROMPT_ID || '332920' }}
  CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

jobs:
  sync-and-translate:
    runs-on: ubuntu-latest
    # Only dev: the Crowdin branch mirrors it, so a run on main would upload older English.
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This workflow is the only uploader. Crowdin's GitHub integration must stay
      # unconfigured: running both created a second, out-of-sync intl_en.arb (#60).
      # Translations are never uploaded — Crowdin is the source of truth for them, and
      # re-uploading stale repo text overwrote human approvals (#2289, #2154).
      - name: Upload sources to Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          crowdin_branch_name: ${{ env.CROWDIN_BRANCH }}

      # Crowdin cannot auto-approve AI output, so the script does it: it AI-translates every
      # string without an approved translation, then approves only the AI ones (machine-
      # translation drafts and people's suggestions stay unapproved).
      - name: AI-translate strings without an approved translation
        run: python3 .github/scripts/crowdin_ai.py pretranslate

      - name: Approve the AI translations
        run: python3 .github/scripts/crowdin_ai.py approve

  download-translations:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    needs: sync-and-translate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only approved text reaches the app: AI translations approved above, or people's.
      # With skip_untranslated_strings, anything else is left out and Flutter falls back to English.
      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true
          export_only_approved: true
          push_translations: false
          crowdin_branch_name: ${{ env.CROWDIN_BRANCH }}

      # The English source is owned by the repo. Never take it from Crowdin: an approved-only
      # export of the `en` target would replace the template gen-l10n builds from.
      - name: Keep the English source from the repo
        run: git checkout -- l10n/intl_en.arb

      # Keep the repo's text where Crowdin exported nothing (hidden/unapproved strings) or text that
      # would break gen-l10n; keep @@locale (needed for intl_cnr.arb); don't add new language files.
      - name: Merge with the repo
        run: python3 .github/scripts/crowdin_ai.py merge

      # Before gen-l10n, so the summary is in the log even when gen-l10n fails.
      - name: Summarize for the sync PR (AI-approved keys, changes vs repo)
        run: python3 .github/scripts/crowdin_ai.py report "$RUNNER_TEMP/pr-body.md"

      # The app compiles against lib/src/generated, not the .arb files, so an .arb-only
      # PR would change nothing on device.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: l10n_crowdin_translations
          base: ${{ github.ref_name }}
          add-paths: |
            l10n/*.arb
            lib/src/generated/*.dart
          commit-message: 'chore(l10n): sync translations from Crowdin'
          title: 'chore(l10n): sync translations from Crowdin'
          body-path: ${{ runner.temp }}/pr-body.md
          delete-branch: true
