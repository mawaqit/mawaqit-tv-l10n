name: Crowdin Sync

on:
  push:
    paths:
      - 'l10n/intl_en.arb'
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # All sources live under this Crowdin branch. No spaces allowed: the action word-splits
  # command_args, and it ignores crowdin_branch_name when running a custom command.
  CROWDIN_BRANCH: dev

jobs:
  sync-and-pretranslate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This workflow is the only uploader. Crowdin's GitHub integration must stay
      # disconnected: running both created a second, out-of-sync intl_en.arb (#60).
      # Translations are never uploaded — Crowdin is the source of truth for them, and
      # re-uploading stale repo text overwrote human approvals (#2289, #2154).
      - name: Upload sources to Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          crowdin_branch_name: ${{ env.CROWDIN_BRANCH }}
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # AI output is never approved (--auto-approve-option none), so export_only_approved
      # below keeps it out of the app until a person approves it. Do not add --label here:
      # it filters WHICH strings get pre-translated, and with no labelled strings the AI
      # silently translated nothing.
      - name: Pre-translate with AI
        uses: crowdin/github-action@v2
        with:
          command: 'pre-translate'
          command_args: >-
            --branch ${{ env.CROWDIN_BRANCH }}
            --method ai --ai-prompt ${{ vars.CROWDIN_AI_PROMPT_ID || '332920' }}
            --translate-untranslated-only --auto-approve-option none
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  download-translations:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: sync-and-pretranslate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only human-approved text reaches the app. Combined with skip_untranslated_strings,
      # unapproved strings are omitted from the .arb and Flutter falls back to English —
      # preferable to shipping a wrong hadith.
      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true
          export_only_approved: true
          push_translations: false
          crowdin_branch_name: ${{ env.CROWDIN_BRANCH }}
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # The English source is owned by the repo. Never take it from Crowdin: an approved-only
      # export of the `en` target would replace the template gen-l10n builds from.
      - name: Keep the English source from the repo
        run: git checkout -- l10n/intl_en.arb

      # The app compiles against lib/src/generated, not the .arb files, so an .arb-only
      # PR would change nothing on device.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: l10n_crowdin_translations
          base: ${{ github.ref_name }}
          add-paths: |
            l10n/*.arb
            lib/src/generated/*.dart
          commit-message: 'chore(l10n): sync translations from Crowdin'
          title: 'chore(l10n): sync translations from Crowdin'
          body: |
            Approved translations from Crowdin, with `lib/src/generated` rebuilt by `flutter gen-l10n`.
          delete-branch: true
