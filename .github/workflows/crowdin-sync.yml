name: Crowdin Sync

on:
  push:
    paths:
      - 'l10n/intl_en.arb'
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-pretranslate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sources are uploaded by Crowdin's own GitHub VCS integration (Integrations tab),
      # not here — running both created a duplicate, out-of-sync source file in Crowdin.
      #
      # Translations are never uploaded from the repo back to Crowdin either — Crowdin
      # is the one-way source of truth for translation text. Re-uploading the repo's
      # own (possibly stale) files on every dev merge overwrote human approvals in
      # Crowdin with old committed text, which is what happened repeatedly to the
      # pt-PT translations in issue #2289 (and, before auto_approve_imported was
      # turned off in a8e6ff5, the same round trip is what let a reversed-meaning
      # Swedish hadith sit "Approved" in issue #2154).
      - name: Wait for Crowdin's native VCS sync to pick up the new sources
        run: sleep 60

      - name: Pre-translate with AI
        uses: crowdin/github-action@v2
        with:
          command: 'pre-translate'
          # --auto-approve-option none is already the CLI default; pinned so a future
          # edit can't quietly promote machine output to approved. --label lets us
          # filter and bulk-review everything the AI wrote.
          command_args: '--method ai --ai-prompt 332920 --translate-untranslated-only --auto-approve-option none --label ai'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  download-translations:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: sync-and-pretranslate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true
          # Only human-approved text reaches the app. Combined with
          # skip_untranslated_strings, unapproved strings are omitted from the .arb
          # and Flutter falls back to English — preferable to shipping a wrong hadith.
          export_only_approved: true
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: 'chore(l10n): sync translations from Crowdin'
          pull_request_body: |
            This PR syncs the latest translations from Crowdin.

            - Auto-generated by Crowdin GitHub Action
            - Pre-translated strings using AI (GPT-4.1)
          pull_request_base_branch_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
