name: Crowdin POC (one key)

# Same flow as crowdin-sync.yml, against Crowdin branch `poc` and l10n-poc/intl_en.arb.

on:
  push:
    branches:
      - crowdin-poc

permissions:
  contents: write
  pull-requests: write

env:
  CROWDIN_BRANCH: poc
  CROWDIN_FILE: l10n-poc/intl_en.arb
  CROWDIN_AI_PROMPT_ID: '332920'
  CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

jobs:
  sync-and-translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload sources to Crowdin
        uses: crowdin/github-action@v2
        with:
          config: crowdin-poc.yml
          crowdin_branch_name: ${{ env.CROWDIN_BRANCH }}
          upload_sources: true
          upload_translations: false
          download_translations: false

      - name: AI-translate strings without an approved translation
        run: python3 .github/scripts/crowdin_ai.py pretranslate

      - name: Approve the AI translations
        run: python3 .github/scripts/crowdin_ai.py approve

  download-translations:
    runs-on: ubuntu-latest
    needs: sync-and-translate
    steps:
      - uses: actions/checkout@v4

      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          config: crowdin-poc.yml
          crowdin_branch_name: ${{ env.CROWDIN_BRANCH }}
          upload_sources: false
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true
          export_only_approved: true
          push_translations: false

      - name: Keep the English source from the repo
        run: git checkout -- l10n-poc/intl_en.arb

      - name: Print downloaded files
        run: for f in l10n-poc/intl_*.arb; do echo "$f $(tr -d '\n' < "$f")"; done

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: List AI translations not yet reviewed
        run: python3 .github/scripts/crowdin_ai.py report "$RUNNER_TEMP/pr-body.md"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: l10n_crowdin_poc
          base: crowdin-poc
          add-paths: |
            l10n-poc/*.arb
            lib/src/generated/*.dart
          commit-message: 'chore(l10n): POC sync from Crowdin'
          title: 'POC: Crowdin one-key sync (do not merge)'
          body-path: ${{ runner.temp }}/pr-body.md
          delete-branch: true
