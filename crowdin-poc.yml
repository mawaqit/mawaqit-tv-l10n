# One-key POC of the Crowdin flow against the real project, isolated in Crowdin branch `poc`.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  - source: /l10n-poc/intl_en.arb
    translation: /l10n-poc/intl_%two_letters_code%.arb
    # Several Crowdin languages share a two-letter code and overwrote each other's file.
    # ku holds the approved Sorani work, sr-Cyrl-ME the approved Serbian; these are empty duplicates.
    excluded_target_languages: [en, ckb, sr, sr-CS]
    languages_mapping:
      two_letters_code:
        pt-BR: pt_BR
        pt-PT: pt_PT
        me: cnr
