project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  - source: /l10n/intl_en.arb
    translation: /l10n/intl_%two_letters_code%.arb
    # Mark translations as unapproved when source changes (requires re-review)
    update_option: update_as_unapproved
    # Several Crowdin languages share a two-letter code and overwrote each other's file.
    # ku holds the approved Sorani work, sr-Cyrl-ME the approved Serbian; ckb/sr/sr-CS are empty duplicates.
    # en is excluded because its "translation" would be written over the source file intl_en.arb.
    excluded_target_languages: [en, ckb, sr, sr-CS]
    languages_mapping:
      two_letters_code:
        pt-BR: pt_BR
        pt-PT: pt_PT
        me: cnr
