project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  - source: /l10n/intl_en.arb
    translation: /l10n/intl_%two_letters_code%.arb
    # Mark translations as unapproved when source changes (requires re-review)
    update_option: update_as_unapproved
    languages_mapping:
      two_letters_code:
        pt-BR: pt_BR
        pt-PT: pt_PT
